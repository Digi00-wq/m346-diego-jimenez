#cloud-config
# KN02 C3: Mein persönliches Standard-Template für alle folgenden KNs.
# Zusätzlich zu C1: Schlüssel der Lehrperson, Härtung (ssh_pwauth, disable_root) und package_update.

package_update: true # [Zusatz 3] führt beim ersten Boot "apt-get update" aus: aktualisiert den Paketindex, damit "packages" die aktuellen Versionen findet

packages: # Pakete, die beim ersten Boot per apt installiert werden
  - fastfetch # zeigt System-Infos (OS, CPU, RAM) an
  - tree # zeigt Verzeichnisse als Baumstruktur an
  - vim # Texteditor

users: # Benutzer, die beim ersten Boot angelegt werden
  - default # behält den Standardbenutzer des Images (bei Ubuntu: "ubuntu")
  - name: diego # mein Benutzer
    sudo: ALL=(ALL) NOPASSWD:ALL # sudoers-Regel: darf alle Befehle ohne Passwort als root ausführen
    shell: /bin/bash # Login-Shell
    ssh_authorized_keys: # öffentliche Schlüssel für /home/diego/.ssh/authorized_keys (das Template enthält zwei)
      - ssh-rsa  diego1 # mein öffentlicher Schlüssel (diego1)
      - ssh-rsa  yves.nussle@lehrperson-m346 # [Zusatz 1] öffentlicher Schlüssel der Lehrperson, damit sie auf meine Instanzen zugreifen kann

ssh_pwauth: false # [Zusatz 2] SSH-Login mit Passwort deaktivieren, nur noch Schlüssel-Login möglich (schützt vor Passwort-Brute-Force)
disable_root: true # [Zusatz 2] direkter SSH-Login als root wird gesperrt; Admin-Arbeit nur über einen normalen Benutzer mit sudo
