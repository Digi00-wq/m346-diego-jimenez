#cloud-config
# cloud-init für den korrigierten Datenbank-Server (KN03 D, nicht ausgeführt)

package_update: true # Paketindex aktualisieren (apt-get update)

packages: # beim ersten Boot installieren
  - mariadb-server # der eigentliche Datenbank-Dienst

users:
  - default # Standardbenutzer "ubuntu" behalten
  - name: diego
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys: # Login nur mit Schlüssel (kein Key Pair in der Konfiguration nötig)
      - ssh-rsa  diego1

ssh_pwauth: false # kein Passwort-Login
disable_root: true # kein direkter root-Login

runcmd:
  # MariaDB lauscht standardmässig nur auf 127.0.0.1; für den Zugriff vom Webserver auf die private IP öffnen.
  # Die Security Group (nur Webserver-SG auf 3306) bleibt die eigentliche Absicherung.
  - sed -i 's/^bind-address.*/bind-address = 0.0.0.0/' /etc/mysql/mariadb.conf.d/50-server.cnf
  - systemctl restart mariadb
