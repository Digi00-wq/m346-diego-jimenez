#cloud-config
# Erste Zeile muss genau "#cloud-config" sein, sonst erkennt cloud-init die User Data nicht als Konfiguration.
# Template aus KN02 (KN02/cloud-init-template.yaml), in KN03 von OpenTofu als user_data übergeben.

package_update: true # führt beim ersten Boot "apt-get update" aus: aktualisiert den Paketindex (Liste verfügbarer Pakete), nicht die installierten Pakete

packages: # Pakete, die beim ersten Boot per apt installiert werden
  - fastfetch # zeigt System-Infos (OS, CPU, RAM) an
  - tree # zeigt Verzeichnisse als Baumstruktur an
  - vim # Texteditor
  - htop # interaktive Prozess- und Ressourcenanzeige (in B2 hinzugefügt -> Instanz wird ersetzt)

users: # Benutzer, die beim ersten Boot angelegt werden
  - default # behält den Standardbenutzer des Images (bei Ubuntu: "ubuntu")
  - name: diego # zusätzlicher Benutzer "diego"
    sudo: ALL=(ALL) NOPASSWD:ALL # sudoers-Regel: darf alle Befehle als jeder Benutzer ohne Passwort ausführen
    shell: /bin/bash # Login-Shell des Benutzers
    ssh_authorized_keys: # öffentliche Schlüssel, die in /home/diego/.ssh/authorized_keys geschrieben werden
      # mein öffentlicher Schlüssel (privater Teil: ~/.ssh/diego1.pem auf meinem Laptop)
      - ssh-rsa  diego1
      # öffentlicher Schlüssel der Lehrperson
      - ssh-rsa  yves.nussle@lehrperson-m346

ssh_pwauth: false # SSH-Login mit Passwort deaktivieren, nur Schlüssel-Login erlaubt
disable_root: true # direkter SSH-Login als root wird gesperrt

write_files: # Dateien, die beim ersten Boot geschrieben werden
  - path: /home/diego/info.txt # Zielpfad der Datei
    owner: diego:diego # Besitzer der Datei (Benutzer:Gruppe), damit diego sie ohne sudo bearbeiten kann
    defer: true # erst in der Schlussphase schreiben, wenn der Benutzer diego (users) schon existiert
    # "|" leitet einen mehrzeiligen Textblock ein: die folgenden eingerückten Zeilen werden wörtlich (mit Zeilenumbrüchen) übernommen
    content: |
      Name: Diego
      Rechte: sudo
      Erstellt von: cloud-init (KN03, OpenTofu user_data)

runcmd: # Befehle, die beim ersten Boot einmalig in der Schlussphase ausgeführt werden (als root)
  - echo "Installation abgeschlossen am $(date)" > /home/diego/cloud-init-fertig.txt # neue Datei mit dem zur Laufzeit ausgewerteten Datum (Nachweis, dass runcmd lief)
